<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — CropMarket</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body data-page="reset">
  <div id="toast-container"></div>
  <div class="auth-layout">
    <div class="auth-form-wrap" style="width:100%;max-width:480px;margin:0 auto;padding:48px 24px">
      <div class="auth-form-inner">
        <a href="index.html" class="auth-logo"><div class="logo-icon"><i class="fa-solid fa-wheat-awn" aria-hidden="true"></i></div>CropMarket</a>
        <h1 class="auth-title">Choose a new password</h1>
        <p class="auth-subtitle">Enter a new password for your account.</p>
        <form id="reset-password-form">
          <div class="form-group">
            <label>New password</label>
            <div class="password-toggle">
              <input type="password" name="password" minlength="6" required autocomplete="new-password">
              <button type="button" class="eye-btn" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
            </div>
          </div>
          <div class="form-group">
            <label>Confirm password</label>
            <div class="password-toggle">
              <input type="password" name="confirm" minlength="6" required autocomplete="new-password">
              <button type="button" class="eye-btn" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:16px">Update password</button>
        </form>
        <p class="auth-footer" style="margin-top:24px"><a href="login.html">Back to sign in</a></p>
      </div>
    </div>
  </div>
  <script src="api-client.js"></script>
  <script src="script.js"></script>
</body>
</html>
